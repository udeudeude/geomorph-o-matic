<text x="52" y="1044" font-family="Georgia,serif" font-size="19" fill="#354c40">ARCHITECTURAL CONFLICT REVEALED, NOT SILENTLY RESOLVED</text>
<text x="52" y="1071" font-family="sans-serif" font-size="13" fill="#56665b">A one-foot higher floor under a continuous crown reduces clearance. Keeping 6.5 ft of local headroom requires the roof to rise.</text>
<text x="52" y="1093" font-family="sans-serif" font-size="12" fill="#7d5d44">Hypothetical fictional cave sections; no measured elevation, bearing, roof stability or certified accessible route.</text>
