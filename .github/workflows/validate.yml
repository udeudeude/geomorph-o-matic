name: Validate geomorphs
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Geometry and circulation
        run: python3 validate.py
      - name: Independent Python terrain contract tests
        run: PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Regenerate original SVGs
        run: node render.js
      - name: Test assembly, terrain and topology
        run: node --test tests/*.test.js
      - name: Generate assembled maps and complete architectural audit
        run: |
          node assemble.js
          node audit.js
          node assemble.js examples/assembly_irregular_3x3.json examples/assembly_irregular_3x3.svg
      - name: Commit verified generated assets on same-repository push
        if: github.event_name == 'push'
        run: |
          git add tiles/ examples/assembly_3x3.svg reports/topology.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: synchronize verified dungeon vectors and topology report"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Verify tracked SVG masters and audit are reproducible
        run: git diff --exit-code -- tiles/ examples/assembly_3x3.svg reports/topology.json
      - name: Upload vector studies and inspection report
        uses: actions/upload-artifact@v4
        with:
          name: geomorph-vector-studies
          path: |
            tiles/*.svg
            examples/assembly_irregular_3x3.svg
            examples/assembly_3x3.svg
            reports/topology.json
          if-no-files-found: error
