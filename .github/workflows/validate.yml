name: Validate geomorphs
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Geometry and circulation
        run: python3 validate.py
      - name: Regenerate original SVGs
        run: node render.js
      - name: Verify SVG masters are reproducible
        run: git diff --exit-code -- tiles/
      - name: Test assembly and topology audits
        run: node --test tests/*.test.js
      - name: Verify assembly and topology reports are reproducible
        run: |
          node assemble.js
          node audit.js
          git diff --exit-code -- examples/assembly_3x3.svg reports/topology.json
      - name: Upload new irregular studies
        uses: actions/upload-artifact@v4
        with:
          name: irregular-vector-studies
          path: |
            tiles/basalt_rift.svg
            tiles/sunken_orrery.svg
          if-no-files-found: error
