name: Validate geomorphs
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Geometry and circulation
        run: python3 validate.py
      - name: Independent Python terrain contract tests
        run: PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Regenerate original SVGs
        run: node render.js
      - name: Test assembly, terrain and topology
        run: node --test tests/*.test.js
      - name: Generate assembled maps and complete architectural audit
        run: |
          node assemble.js
          node audit.js
          node cave-passage-widths.js reports/cave-passage-widths.json
          node cave-axes.js reports/cave-axes.json
          node cave-rock-ribs.js reports/cave-rock-ribs.json
          node wide-cave.js
          node wide-headroom.js
          node wide-roof-transitions.js
          node wide-vertical-datum.js
          node wide-absolute-bench.js
          node wide-vault-plate.js
          node wide-transverse-sections.js
          node wide-seam-crowns.js
          node wide-posture-assembly.js
          node wide-assembly-audit.js reports/wide-assembly-routes.json
          node seam-profiles.js reports/seam-families.json
          node cave-section-envelopes.js reports/cave-section-envelopes.json examples/cave_section_envelopes.svg
          node assemble.js examples/assembly_irregular_3x3.json examples/assembly_irregular_3x3.svg
          node assemble.js examples/assembly_fallen_choir_2x2.json examples/assembly_fallen_choir_2x2.svg
          node assemble.js examples/assembly_hollow_2x2.json examples/assembly_hollow_2x2.svg
          node assemble.js examples/assembly_scoured_2x2.json examples/assembly_scoured_2x2.svg
          node assemble.js examples/assembly_lantern_2x2.json examples/assembly_lantern_2x2.svg
          node section-plates.js examples/riftwater_section.svg
          node flood-stages.js examples/riftwater_surge.svg
          node measured-section.js examples/riftwater_profile.svg
          node tailrace-plate.js examples/riftwater_tailrace_plate.svg
          node subfloor-assembly-plate.js examples/subfloor_pair_plate.svg
          node outfall-section.js examples/postern_outfall_section.svg
          node receiving-annex-plate.js examples/receiving_annex_plate.svg
          node maintenance-plate.js examples/riftwater_maintenance_plate.svg
          node gearbox-audit.js reports/gearbox-access.json
          node foundation-clearance.js reports/buried-clearance.json
          node print-review.js examples/riftwater_print_letter.svg
          node print-review.js examples/fallen_choir_print_letter.svg fallen_choir
          node print-review.js examples/hollow_causeway_print_letter.svg hollow_causeway
          node print-review.js examples/scoured_siphon_print_letter.svg scoured_siphon
          node print-review.js examples/lantern_sink_print_letter.svg lantern_sink
          node choir-levels-plate.js examples/fallen_choir_levels.svg
          node cave-profile.js examples/scoured_siphon_profiles.svg
          node basalt-web-plate.js examples/basalt_rift_webs.svg
      - name: Check editable vector XML and complete generated plate set
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          paths = sorted(Path("tiles").glob("*.svg"))
          paths += sorted(Path("examples").glob("*.svg"))
          paths += sorted(Path("studies").glob("*.svg"))
          assert len(paths) >= 33, f"Missing generated vector artifacts: {len(paths)}"
          for path in paths:
              root = ET.parse(path).getroot()
              assert root.tag == "{http://www.w3.org/2000/svg}svg", path
              assert root.find("{http://www.w3.org/2000/svg}title") is not None, path
          print(f"Validated {len(paths)} XML vector drawings")
          PY
      - name: Commit verified generated assets on same-repository push
        if: github.event_name == 'push'
        run: |
          git add studies/*.svg reports/wide-lava-routes.json reports/sheetflow-routes.json reports/spine-routes.json reports/wide-assembly-routes.json reports/wide-roof-clearance.json reports/wide-roof-transitions.json reports/sheetflow-bench-grade.json reports/sheetflow-bench-crown.json reports/sheetflow-authored-vault.json reports/wide-transverse-sections.json reports/wide-seam-crowns.json reports/wide-posture-assembly.json tiles/ examples/assembly_fallen_choir_2x2.svg examples/fallen_choir_print_letter.svg examples/assembly_hollow_2x2.svg examples/hollow_causeway_print_letter.svg examples/assembly_scoured_2x2.svg examples/assembly_lantern_2x2.svg examples/scoured_siphon_print_letter.svg examples/lantern_sink_print_letter.svg examples/fallen_choir_levels.svg examples/scoured_siphon_profiles.svg examples/basalt_rift_webs.svg examples/cave_section_envelopes.svg examples/assembly_3x3.svg examples/riftwater_section.svg examples/riftwater_surge.svg examples/riftwater_profile.svg examples/riftwater_tailrace_plate.svg examples/subfloor_pair_plate.svg examples/postern_outfall_section.svg examples/receiving_annex_plate.svg examples/riftwater_maintenance_plate.svg examples/riftwater_print_letter.svg reports/topology.json reports/cave-passage-widths.json reports/cave-axes.json reports/cave-rock-ribs.json reports/seam-families.json reports/cave-section-envelopes.json reports/print-scale.json reports/buried-clearance.json reports/gearbox-access.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: synchronize verified dungeon vectors and topology report"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Verify tracked SVG masters and audit are reproducible
        run: git diff --exit-code -- studies/ reports/wide-lava-routes.json reports/sheetflow-routes.json reports/spine-routes.json reports/wide-assembly-routes.json reports/wide-roof-clearance.json reports/wide-roof-transitions.json reports/sheetflow-bench-grade.json reports/sheetflow-bench-crown.json reports/wide-transverse-sections.json reports/wide-seam-crowns.json reports/wide-posture-assembly.json tiles/ examples/assembly_fallen_choir_2x2.svg examples/fallen_choir_print_letter.svg examples/assembly_hollow_2x2.svg examples/hollow_causeway_print_letter.svg examples/assembly_scoured_2x2.svg examples/assembly_lantern_2x2.svg examples/scoured_siphon_print_letter.svg examples/lantern_sink_print_letter.svg examples/fallen_choir_levels.svg examples/scoured_siphon_profiles.svg examples/basalt_rift_webs.svg examples/cave_section_envelopes.svg examples/assembly_3x3.svg examples/riftwater_section.svg examples/riftwater_surge.svg examples/riftwater_profile.svg examples/riftwater_tailrace_plate.svg examples/subfloor_pair_plate.svg examples/postern_outfall_section.svg examples/riftwater_maintenance_plate.svg examples/riftwater_print_letter.svg reports/topology.json reports/cave-passage-widths.json reports/cave-axes.json reports/cave-rock-ribs.json reports/seam-families.json reports/cave-section-envelopes.json reports/print-scale.json reports/buried-clearance.json reports/gearbox-access.json
      - name: Upload vector studies and inspection report
        uses: actions/upload-artifact@v4
        with:
          name: geomorph-vector-studies
          path: |
            tiles/*.svg
            studies/*.svg
            examples/assembly_irregular_3x3.svg
            examples/assembly_fallen_choir_2x2.svg
            examples/assembly_hollow_2x2.svg
            examples/assembly_scoured_2x2.svg
            examples/assembly_lantern_2x2.svg
            examples/scoured_siphon_print_letter.svg
            examples/lantern_sink_print_letter.svg
            examples/hollow_causeway_print_letter.svg
            examples/fallen_choir_print_letter.svg
            examples/fallen_choir_levels.svg
            examples/scoured_siphon_profiles.svg
            examples/basalt_rift_webs.svg examples/cave_section_envelopes.svg
            examples/assembly_3x3.svg
            examples/riftwater_section.svg
            examples/riftwater_surge.svg
            examples/riftwater_profile.svg
            examples/riftwater_tailrace_plate.svg
            examples/subfloor_pair_plate.svg
            examples/postern_outfall_section.svg
            examples/receiving_annex_plate.svg
            examples/riftwater_maintenance_plate.svg
            examples/riftwater_print_letter.svg
            reports/topology.json
            reports/wide-lava-routes.json
            reports/sheetflow-bench-grade.json
            reports/sheetflow-bench-crown.json
            reports/sheetflow-authored-vault.json
            reports/wide-transverse-sections.json
            reports/wide-seam-crowns.json
            reports/wide-roof-transitions.json
            reports/wide-posture-assembly.json
            reports/sheetflow-routes.json reports/spine-routes.json reports/wide-assembly-routes.json
            reports/cave-passage-widths.json
            reports/cave-axes.json
            reports/cave-rock-ribs.json reports/seam-families.json reports/cave-section-envelopes.json
            reports/print-scale.json
            reports/buried-clearance.json
            reports/gearbox-access.json
          if-no-files-found: error
